server {
    listen 80;
    server_name localhost;

    # Serve the repository root so /pw-admin maps to ./pw-admin
    root /var/www/html;
    index index.php index.html;

    # Security: never expose storage contents
    location ^~ /pw-storage/ {
        deny all;
        return 403;
    }

    # Optional: protect other internal folders if you want
    # location ^~ /app/ { deny all; return 403; }
    # location ^~ /content/ { deny all; return 403; }

    # Typical: prevent executing PHP inside uploads (good habit)
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; return 403; }
        try_files $uri $uri/ =404;
    }

    # Serve static files directly when they exist
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP handling
    location ~ \.php$ {
        # Don't allow direct access to PHP files under /pw-storage just in case
        if ($uri ~ "^/pw-storage/") { return 403; }

        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        fastcgi_pass php:9000;
    }
}
